name: SafeDep vet

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

concurrency:
  group: vet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: safedep/vet@v2.0.0-alpha.20261124143912
        with:
          policy: .github/vet/policy.yml
          package-cooldown: "3"
