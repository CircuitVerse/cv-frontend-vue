name: Dev Container

on:
  pull_request:
    paths:
      - ".devcontainer/*"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/devcontainer.yml"

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate devcontainer.json
        run: jq . < .devcontainer/devcontainer.json

      - name: Build and smoke test dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          env: |
            CODESPACES=true
            GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN=app.github.dev
          runCmd: |
            npm run dev > /tmp/dev.log 2>&1 &

            ready=""
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/simulatorvue/v0/ || true)
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 400 ] 2>/dev/null; then
                ready=1
                break
              fi
              sleep 3
            done
            if [ -z "$ready" ]; then
              echo "dev server did not respond on port 4000"
              cat /tmp/dev.log
              exit 1
            fi
            echo "dev server responded with $code"

            echo "checking the bind address is not loopback-only"
            ss -ltn | grep ":4000" || true
            if ! ss -ltn | grep ":4000 " | grep -v -e "127.0.0.1:4000" -e "\[::1\]:4000" >/dev/null; then
              echo "vite bound to loopback only, expected all interfaces"
              exit 1
            fi

            echo "checking a forwarded Codespaces host is accepted"
            fwd_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: fake-codespace-4000.app.github.dev" http://localhost:4000/simulatorvue/v0/ || true)
            echo "forwarded-host request responded with $fwd_code"
            if [ "$fwd_code" -ge 400 ] 2>/dev/null; then
              echo "request with a forwarded Codespaces host was rejected"
              exit 1
            fi

            echo "checking an unrelated host is still rejected"
            bad_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: evil.example.com" http://localhost:4000/simulatorvue/v0/ || true)
            echo "unrelated-host request responded with $bad_code"
            if [ "$bad_code" -lt 400 ] 2>/dev/null; then
              echo "server accepted an arbitrary host"
              exit 1
            fi
